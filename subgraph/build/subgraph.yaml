specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: CharterRegistry
    network: hedera-testnet
    source:
      address: "0x7Bf153267E289f2B5F8b639adcb6c11dE29fA04A"
      abi: CharterRegistry
      startBlock: 40434184
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Charter
        - Execution
        - Service
        - CharterStats
      abis:
        - name: CharterRegistry
          file: CharterRegistry/CharterRegistry.json
      eventHandlers:
        - event: CharterCreated(indexed uint256,indexed address,indexed
            bytes32,string,uint256,uint8,uint64)
          handler: handleCharterCreated
        - event: CharterRevoked(indexed uint256,indexed address)
          handler: handleCharterRevoked
        - event: CharterExecution(indexed uint256,indexed address,uint256,string,bytes32)
          handler: handleCharterExecution
      file: CharterRegistry/CharterRegistry.wasm
