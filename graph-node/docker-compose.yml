version: "3.9"

services:
  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: graph
      POSTGRES_PASSWORD: letmein
      POSTGRES_DB: graph
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph -d graph"]
      interval: 10s
      timeout: 5s
      retries: 5

  ipfs:
    image: ipfs/kubo:v0.21.0
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ipfs-data:/data/ipfs

  graph-node:
    image: graphprotocol/graph-node:v0.37.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_started
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8020:8020"
      - "8030:8030"
      - "8040:8040"
    environment:
      postgres_host: postgres
      postgres_user: graph
      postgres_pass: letmein
      postgres_db: graph
      ipfs: "ipfs:5001"
      ethereum: "hedera-testnet:https://testnet.hashio.io/api"
      GRAPH_LOG: info
      RUST_LOG: info
      GRAPH_ALLOW_NON_DETERMINISTIC_IPFS: "true"
    volumes:
      - ./data:/data

volumes:
  postgres-data:
  ipfs-data:
